<!doctype html>
<html lang="ru">
<head>
    <link rel="icon" type="image/x-icon" href="liceum.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- чтоб сайт не сжимало и не растягивало -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- ускорение загрузки шрифтов -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- ускорение загрузки шрифтов -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&amp;display=swap" rel="stylesheet"> <!-- загрузка шрифтов -->
    <title>Самоуправление 2026</title> <!-- название страницы -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- подключение бустрапа -->
    <link rel="stylesheet" href="css/style.css"> <!-- связь с ксс -->
</head>

<body>

<!-- ШАПКА КАК У ОСНОВНОЙ СТРАНИЦЫ -->
<header class="container-fluid"> <!-- растягивает шапку до краев -->
    <div class="container"> <!-- центровка контента -->
        <div class="row align-items-center"> <!-- выравнивание по вертикали -->
            <div class="col-6 col-md-4 text-start"> <!-- выделяет место логотипу на всех видах устройств -->
                <h1 class="logo">Самоуправление 2026</h1> <!-- логотип -->
            </div>
        </div>
    </div>
</header>
<!-- КОНЕЦ ШАПКИ КАК У ОСНОВНОЙ СТРАНИЦЫ -->

<!-- ФОРМА РЕГИСТРАЦИИ -->
<div class="container pb-5"> <!-- центровка контента -->
    <div class="input-group"> <!-- класс всех надписей и кнопок ввода -->
        <span class="input-group-text mt-3 none-mobile">Класс и группа</span> <!-- надпись -->
        <select class="form-select mt-3" id="classSelect" aria-label="Default select example"> <!-- выпадающий список классов -->
            <option selected disabled>Выберите ваш класс...</option> <!-- надпись -->
            <!-- сами классы -->
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
        </select>

        <select class="form-select mt-3" id="dynamicSelect" disabled> <!-- глушилка выбора группы -->
            <option selected disabled>Сначала выберите класс...</option> <!-- текст глушилки -->
        </select>
    </div>
    <div class="input-group"> <!-- класс всех надписей и кнопок ввода -->
        <span class="input-group-text mt-3 none-mobile">Вы - </span> <!-- текст -->
        <select class="form-select mt-3" id="nameSelect" disabled> <!-- глушилка выбора имени -->
            <option selected disabled>Сначала выберите класс и группу...</option> <!-- текст -->
        </select>
    </div>
    <div class="input-group"> <!-- класс всех надписей и кнопок ввода -->
        <span class="input-group-text mt-3">Введите пароль</span> <!-- текст -->
        <div class="input-group-text mt-3"> <!-- контейнер полей ввода -->
            <input type="password" class="form-control" id="exampleInputPassword1">
        </div>
        <div id="passwordError" style="color: red; font-size: 14px; margin-top: 5px; min-height: 20px; width: 100%;"></div> <!-- контейнер для ошибки паролей -->
        <div class="mt-4 mx-3 form-check"> <!-- контейнер чекера -->
            <input type="checkbox" class="form-check-input" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Запомнить меня</label>
        </div>
    </div>
    <!-- другие кнопки -->
    <button id="loginBtn" type="button" class="submit mt-3 btn btn-primary pink-mobile main-button">Войти</button>
    <button type="button" onclick="window.location.href='imdubler.html'" class="submit mt-3 btn btn-primary">Я дублер</button>
    <button id="guestBtn" type="button" class="submit mt-3 btn btn-primary">Войти как гость</button>
</div>

<!-- ФУТЕР -->
<div class="footer container-fluid"> <!-- контейнер всего футера, который растягивается на всю ширину -->
    <div class="footer-content container"> <!-- контейнер контента в футере -->
        <div class="row"> <!-- строка -->
            <div class="footer-section about col-md-4 col-12"> <!-- разделение футера -->
                <p>
                    Самоуправление 2026 - это сайт, сделанный специально для одноименного мероприятия
                    в Усть-Илимском Экспериментальном лицее имени М.М.Батербиева.
                </p>
                <div class="socials"> <!-- соцсети с кастомным классом -->
                <!-- список соцсетей -->
                    <a href="https://t.me/apple_winner"><i class="fab fa-telegram"></i></a>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- дезигнед -->
<div class="footer-bottom container-fluid">
        &copy; https://samoupravlenie2026.ru | Designed by morisar
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- бустрап -->
    <script src="script.js"></script> <!-- подключение js файла -->
</body>
</html>
